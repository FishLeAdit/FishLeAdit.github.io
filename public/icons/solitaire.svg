<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- back card -->
  <rect x="2" y="6" width="17" height="23" fill="#1f3fbf" stroke="#000000" stroke-width="1"/>
  <rect x="4" y="8" width="13" height="19" fill="none" stroke="#ffffff" stroke-width="1"/>
  <g fill="#6f8be6">
    <rect x="6" y="10" width="2" height="2"/><rect x="10" y="10" width="2" height="2"/><rect x="14" y="10" width="1" height="2"/>
    <rect x="8" y="14" width="2" height="2"/><rect x="12" y="14" width="2" height="2"/>
    <rect x="6" y="18" width="2" height="2"/><rect x="10" y="18" width="2" height="2"/><rect x="14" y="18" width="1" height="2"/>
    <rect x="8" y="22" width="2" height="2"/><rect x="12" y="22" width="2" height="2"/>
  </g>
  <!-- front card -->
  <rect x="11" y="2" width="19" height="25" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <!-- A -->
  <g fill="#c00000">
    <rect x="14" y="4" width="2" height="1"/>
    <rect x="13" y="5" width="1" height="4"/><rect x="16" y="5" width="1" height="4"/>
    <rect x="14" y="7" width="2" height="1"/>
  </g>
  <!-- heart -->
  <g fill="#c00000">
    <rect x="17" y="11" width="3" height="1"/><rect x="22" y="11" width="3" height="1"/>
    <rect x="16" y="12" width="10" height="3"/>
    <rect x="17" y="15" width="8" height="1"/>
    <rect x="18" y="16" width="6" height="1"/>
    <rect x="19" y="17" width="4" height="1"/>
    <rect x="20" y="18" width="2" height="1"/>
  </g>
</svg>
